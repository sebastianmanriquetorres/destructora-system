<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="/static/index.css">
</head>
<body>
<div class="page-shell">
    <section class="content-card auth-card">
        <header class="card-header">
            <span class="eyebrow">Panel Administrativo</span>
            <h1>Iniciar sesión</h1>
            <p>Accede al panel de administración para gestionar las solicitudes de máquinas destructoras de papel. El registro es opcional para usuarios que deseen tener una cuenta.</p>
        </header>

        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form action="/login" method="post" class="auth-form">
            <div class="field-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="Correo" required>
            </div>
            <div class="field-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Contraseña" required>
            </div>
            <button type="submit" class="submit-button">Ingresar</button>
        </form>

        <div class="footer-note">
            <p>¿No tienes cuenta? <a href="/register">Regístrate aquí</a></p>
        </div>
    </section>
</div>
</body>
</html>
