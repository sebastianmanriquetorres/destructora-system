<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="/static/index.css">
</head>
<body>
<div class="page-shell">
    <section class="content-card auth-card">
        <header class="card-header">
            <span class="eyebrow">Registro seguro</span>
            <h1>Crea tu cuenta</h1>
            <p>Regístrate para enviar solicitudes y recibir notificaciones por correo.</p>
        </header>

        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        {% if success %}
            <div class="alert alert-success">{{ success }}</div>
        {% endif %}

        <form action="/register" method="post" class="auth-form">
            <div class="field-group">
                <label for="nombre_apellido">Nombre y Apellido</label>
                <input type="text" id="nombre_apellido" name="nombre_apellido" placeholder="Nombre y apellido" required>
            </div>
            <div class="field-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="Correo" required>
            </div>
            <div class="field-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Contraseña" required>
            </div>
            <div class="field-group">
                <label for="cargo">Cargo</label>
                <input type="text" id="cargo" name="cargo" placeholder="Cargo" required>
            </div>
            <button type="submit" class="submit-button">Crear cuenta</button>
        </form>

        <div class="footer-note">
            <p>¿Ya tienes cuenta? <a href="/login">Iniciar sesión</a></p>
        </div>
    </section>
</div>
</body>
</html>
